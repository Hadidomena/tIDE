min_version: 2.0.0

assert_lefthook_installed: true

pre-commit:
  skip:
    - merge_commit
    - rebase
  jobs:
    - name: whitespace
      run: git diff --check --cached
      fail_text: "Trailing whitespace or conflict markers in staged changes"

    - name: rust-fmt
      root: src-tauri/
      glob: "*.rs"
      run: cargo fmt -- {staged_files}
      stage_fixed: true
      fail_text: "rustfmt failed on staged Rust files"

    - name: rust-clippy
      root: src-tauri/
      glob: "*.rs"
      run: cargo clippy --all-targets -- -D warnings
      fail_text: "cargo clippy reported warnings (treated as errors)"

    - name: eslint
      glob: "src/**/*.{ts,js,svelte}"
      run: npx --no-install eslint --fix {staged_files}
      stage_fixed: true
      fail_text: "eslint failed on staged frontend files"

    - name: prettier
      glob: "src/**/*.{ts,js,svelte,json,css}"
      run: npx --no-install prettier --write {staged_files}
      stage_fixed: true
      fail_text: "prettier could not format staged frontend files"

commit-msg:
  skip:
    - merge_commit
    - rebase
  jobs:
    - name: conventional-commit
      run: "grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([a-z0-9./_-]+\\))?!?: .{3,}' \"{1}\""
      fail_text: 'Use Conventional Commits: type(scope): subject — e.g. "feat(editor): add tidal grammar"'

pre-push:
  skip:
    - rebase
  jobs:
    - name: cargo-test
      root: src-tauri/
      glob: "*.rs"
      run: cargo test
      fail_text: "cargo test failed — fix before pushing"

    - name: svelte-check
      glob: "src/**/*.{ts,js,svelte}"
      run: npm run check --if-present
      fail_text: "svelte-check failed — fix before pushing"

post-merge:
  jobs:
    - name: deps-sync
      run: |
        [ -f package.json ] && npm install --silent
        [ -f src-tauri/Cargo.toml ] && (cd src-tauri && cargo fetch --quiet)
        true
