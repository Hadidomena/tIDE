name: test
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: npm }
      - run: npm ci
      - name: eslint
        run: npm run lint
      - name: svelte-check
        run: npm run check
      - name: prettier (check only)
        run: npx prettier --check .

  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: system deps
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri' }
      - name: rustfmt (check only)
        run: cargo fmt --check
        working-directory: src-tauri
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: tests
        run: cargo test
        working-directory: src-tauri

  repl-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: system deps
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev cmake
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabal
            ~/.ghc
            /usr/local/.ghcup
          key: ghcup-ghc-9.10.3-tidal-v2
      - name: install ghc 9.10.3 + cabal (runner preinstalled ghcup)
        run: |
          sudo mkdir -p /usr/local/.ghcup
          sudo chown -R "$USER" /usr/local/.ghcup
          test -x /usr/local/.ghcup/bin/ghcup || { echo "image has no preinstalled ghcup?"; exit 1; }
          echo "/usr/local/.ghcup/bin" >> "$GITHUB_PATH"
          GH=/usr/local/.ghcup/bin/ghcup
          "$GH" install ghc 9.10.3
          "$GH" install cabal latest
          "$GH" set ghc 9.10.3
          "$GH" --version
          ghc --version
          cabal --version

      - name: install tidal
        run: |
          cabal update
          cabal install --lib tidal
      - name: tidal probe (fail fast, before ~5 min of rustc)
        run: echo ':q' | ghci -package tidal -e 'import Sound.Tidal.Context' && echo TIDAL-PROBE-OK
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri' }
      - name: ghci sessions + prelude + detector integration tests
        run: cargo test -- --ignored --test-threads=1 --skip superdirt
        working-directory: src-tauri
