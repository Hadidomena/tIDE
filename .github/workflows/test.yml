name: test
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: npm }
      - run: npm ci
      - name: eslint
        run: npm run lint
      - name: svelte-check
        run: npm run check
      - name: prettier (check only)
        run: npx prettier --check .

  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: system deps
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri' }
      - name: rustfmt (check only)
        run: cargo fmt --check
        working-directory: src-tauri
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: tests
        run: cargo test
        working-directory: src-tauri

  # Dispatch-only (a 15-30 min cabal compile per PR is not free-CI-friendly).
  # Runs the #[ignore]d supervisor integration test against REAL ghci + tidal (m1-plan step 6).
  repl-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # webkit stack for tauri crates + cmake — tidal-link C++ build (bit us on the dev machine)
      - name: system deps
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev cmake
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabal
            ~/.ghc
            /usr/local/.ghcup
          key: ghcup-ghc-9.10.3-tidal-v2
      - name: install ghcup + ghc 9.10.3 + cabal
        run: |
          # GitHub's ubuntu runner image exports GHCUP_INSTALL_BASE_PREFIX=/usr/local
          # (root-owned ghcup preinstall) — the bootstrap honors it and chmod fails
          # (runs 39402114411, 39403299370). Override to $HOME explicitly. INSTALL_DIR
          # is NOT a bootstrap variable (first fix attempt, no effect).
          curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org \
            | BOOTSTRAP_HASKELL_NONINTERACTIVE=1 BOOTSTRAP_HASKELL_MINIMAL=1 GHCUP_INSTALL_BASE_PREFIX="$HOME" sh
          echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"
          "$HOME/.ghcup/bin/ghcup" install ghc 9.10.3
          "$HOME/.ghcup/bin/ghcup" install cabal latest
          "$HOME/.ghcup/bin/ghcup" set ghc 9.10.3
      - name: install tidal
        run: |
          cabal update
          cabal install --lib tidal
      - name: tidal probe (fail fast, before ~5 min of rustc)
        run: echo ':q' | ghci -package tidal -e 'import Sound.Tidal.Context' && echo TIDAL-PROBE-OK
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri' }
      - name: ghci session integration tests
        run: cargo test -- --ignored
        working-directory: src-tauri
